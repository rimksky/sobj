# nginx reverse proxy example for sobj (v0.3)
#
# - HTTP reverse proxy to sobj-server
# - optional: you can terminate TLS at nginx and forward to sobj-server over HTTP
#
# NOTE:
# sobj-server itself can listen publicly (0.0.0.0:9999), so nginx is optional.

server {
    listen 80;
    server_name _;

    # client_max_body_size should be large enough for big uploads
    client_max_body_size 20G;

    # Important for streaming uploads/downloads
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9999;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Keep original client info
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for big objects
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
