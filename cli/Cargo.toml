[package]
name = "sobj"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
urlencoding = "2"
mime_guess = "2"
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["io"] }
