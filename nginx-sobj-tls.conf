# nginx TLS reverse proxy example for sobj (v0.3)
#
# - Terminates TLS at nginx (443)
# - Proxies to sobj-server over HTTP (127.0.0.1:9999)
#
# Replace:
#   server_name, ssl_certificate, ssl_certificate_key

server {
    listen 443 ssl http2;
    server_name sobj.example.com;

    ssl_certificate     /etc/letsencrypt/live/sobj.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sobj.example.com/privkey.pem;

    client_max_body_size 20G;

    # Important for streaming uploads/downloads
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9999;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Optional: redirect HTTP -> HTTPS
server {
    listen 80;
    server_name sobj.example.com;
    return 301 https://$host$request_uri;
}
